<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Journal V5</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#0b0e11;--c:#151924;--t:#eaecef;--m:#848e9c;--g:#0ecb81;--r:#f6465d;--o:#f0b90b;--b:#2b3139;--bl:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:var(--bg);color:var(--t);padding:16px;padding-bottom:90px}
h1{font-size:1.3rem;margin-bottom:12px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--c);padding:16px;border-radius:10px;margin-bottom:14px;border:1px solid var(--b)}
.si{display:flex;flex-direction:column;gap:3px}
.sl{color:var(--m);font-size:.75rem}
.sv{font-size:1.2rem;font-weight:bold}
.g{color:var(--g)}.r{color:var(--r)}.o{color:var(--o)}
.cc{background:var(--c);padding:14px;border-radius:10px;margin-bottom:14px;border:1px solid var(--b);height:200px;position:relative}
.st{color:var(--o);font-size:.95rem;margin-bottom:8px;font-weight:bold}
.tc{background:var(--c);padding:12px;border-radius:10px;margin-bottom:14px;border:1px solid var(--b);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--m);font-size:.72rem;padding:8px 4px;border-bottom:1px solid var(--b)}
td{padding:10px 4px;border-bottom:1px solid var(--b);font-size:.82rem}
.tr{text-align:right}.tt{text-align:center}
.tl{display:flex;flex-direction:column;gap:8px}
.ti{background:var(--c);padding:12px;border-radius:8px;border:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}
.tp{font-weight:bold;font-size:.9rem}
.tm{color:var(--m);font-size:.72rem}
.tv{font-weight:bold;font-size:1rem}
.fc{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.fb{height:50px;border-radius:25px;border:none;display:flex;justify-content:center;align-items:center;cursor:pointer;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.fb:active{transform:scale(.95)}
.fa{width:50px;background:var(--g);color:#000;font-size:24px}
.fe{padding:0 16px;background:var(--o);color:#000;font-size:13px}
.fi{padding:0 16px;background:var(--bl);color:#fff;font-size:13px}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:200;padding:16px}
.md{background:var(--c);padding:16px;border-radius:10px;width:100%;max-width:500px;border:1px solid var(--b);max-height:90vh;overflow-y:auto}
.md h2{margin-bottom:12px;font-size:1.1rem}
.fg{margin-bottom:10px}
.fg label{display:block;color:var(--m);font-size:.72rem;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px;background:var(--bg);border:1px solid var(--b);color:var(--t);border-radius:5px;font-size:.82rem}
.fr{display:flex;gap:8px}.fr .fg{flex:1}
.bs{width:100%;padding:10px;background:var(--g);color:#000;border:none;border-radius:5px;font-weight:bold;font-size:.95rem;cursor:pointer;margin-top:8px}
.bc{width:100%;padding:10px;background:transparent;color:var(--m);border:1px solid var(--b);border-radius:5px;font-size:.95rem;cursor:pointer;margin-top:8px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--g);color:#000;padding:8px 16px;border-radius:16px;font-weight:bold;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;font-size:.85rem}
.toast.show{opacity:1}
</style>
</head>
<body>
<h1>&#x1F5A4; GHOST JOURNAL V5</h1>
<div class="sg">
<div class="si"><span class="sl">Trades ferm&#233;s</span><span class="sv" id="s1">0</span></div>
<div class="si"><span class="sl">Winrate</span><span class="sv g" id="s2">0%</span></div>
<div class="si"><span class="sl">Net R</span><span class="sv g" id="s3">+0.0</span></div>
<div class="si"><span class="sl">Net %</span><span class="sv g" id="s4">+0.00</span></div>
<div class="si"><span class="sl">Plan OK</span><span class="sv o" id="s5">0%</span></div>
<div class="si"><span class="sl">Trades total</span><span class="sv" id="s6">0</span></div>
</div>
<div class="cc"><canvas id="ch"></canvas></div>
<div class="st">Par signal</div>
<div class="tc"><table><thead><tr><th></th><th class="tt">N</th><th class="tt">W</th><th class="tr">NET R</th></tr></thead><tbody id="t1"></tbody></table></div>
<div class="st">Par session</div>
<div class="tc"><table><thead><tr><th></th><th class="tt">N</th><th class="tt">W</th><th class="tr">NET R</th></tr></thead><tbody id="t2"></tbody></table></div>
<div class="st">Historique r&#233;cent</div>
<div class="tl" id="tl"></div>
<div class="fc">
<button class="fb fi" onclick="document.getElementById('fi').click()">IMPORT</button>
<input type="file" id="fi" style="display:none" accept=".json" onchange="imp(this)">
<button class="fb fe" onclick="exp()">EXPORT</button>
<button class="fb fa" onclick="openM()">+</button>
</div>
<div class="mo" id="modal">
<div class="md">
<h2>+ AJOUT TRADE</h2>
<div class="fr"><div class="fg"><label>Date</label><input type="date" id="i1"></div><div class="fg"><label>Heure</label><input type="time" id="i2"></div></div>
<div class="fr"><div class="fg"><label>Paire</label><input type="text" id="i3" placeholder="BTCUSDT"></div><div class="fg"><label>Sens</label><select id="i4"><option>LONG</option><option>SHORT</option></select></div></div>
<div class="fr"><div class="fg"><label>Signal</label><select id="i5"><option>ENG</option><option>PIN</option><option>HUNT</option><option>PIN+AR</option><option>ENG 15m</option><option>ENG 3m</option><option>ENG 5m</option></select></div><div class="fg"><label>Session</label><select id="i6"><option>LONDRES</option><option>NY</option><option>ASIE</option><option>HORS KILLZONE</option></select></div></div>
<div class="fr"><div class="fg"><label>Grade</label><select id="i7"><option>A</option><option>B</option><option>C</option></select></div><div class="fg"><label>Risque %</label><input type="number" id="i8" value="0.3" step="0.05"></div></div>
<div class="fr"><div class="fg"><label>RR pr&#233;vu</label><input type="number" id="i9" value="3.0" step="0.1"></div><div class="fg"><label>RR r&#233;alis&#233;</label><input type="number" id="i10" value="0.0" step="0.1"></div></div>
<div class="fr"><div class="fg"><label>Statut</label><select id="i11"><option>Closed</option><option>Annul&#233;</option><option>Open</option></select></div><div class="fg"><label>Plan OK</label><select id="i12"><option>OUI</option><option>NON</option></select></div></div>
<div class="fg"><label>Notes</label><textarea id="i13" rows="2" placeholder="Le&#231;on du trade..."></textarea></div>
<button class="bs" onclick="addT()">ENREGISTRER</button>
<button class="bc" onclick="closeM()">ANNULER</button>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
function G(o,k){var keys=Object.keys(o);for(var i=0;i<keys.length;i++){if(keys[i].trim()===k){var v=o[keys[i]];return typeof v==="string"?v.trim():v}}return ""}
var trades=[],ci=null;
function load(){var s=localStorage.getItem("gj5");if(s){try{trades=JSON.parse(s)}catch(e){trades=[]}}else{trades=[]}}
function save(){localStorage.setItem("gj5",JSON.stringify(trades))}
function getRR(t){var v=G(t,"RR r\u00e9alis\u00e9");if(v===""||v===undefined)v=G(t,"RR realise");return parseFloat(v)||0}
function getRP(t){var v=G(t,"R\u00e9sultat %");if(v===""||v===undefined)v=G(t,"Resultat %");return parseFloat(v)||0}
function init(){load();render();document.getElementById("i1").valueAsDate=new Date();var n=new Date();document.getElementById("i2").value=("0"+n.getHours()).slice(-2)+":"+("0"+n.getMinutes()).slice(-2)}
function render(){
var c=trades.filter(function(t){return G(t,"Statut")==="Closed"});
var tot=c.length,w=0,nr=0,np=0,pok=0;
for(var i=0;i<c.length;i++){var rr=getRR(c[i]);var rp=getRP(c[i]);nr+=rr;np+=rp;if(rr>0)w++;if(G(c[i],"Plan OK")==="OUI")pok++}
var wr=tot>0?Math.round(w/tot*100):0;
var pp=tot>0?Math.round(pok/tot*100):0;
document.getElementById("s1").innerText=tot;
document.getElementById("s6").innerText=trades.length;
var e2=document.getElementById("s2");e2.innerText=wr+"%";e2.className="sv "+(wr>=50?"g":"r");
var e3=document.getElementById("s3");e3.innerText=(nr>0?"+":"")+nr.toFixed(1);e3.className="sv "+(nr>=0?"g":"r");
var e4=document.getElementById("s4");e4.innerText=(np>0?"+":"")+np.toFixed(2);e4.className="sv "+(np>=0?"g":"r");
var e5=document.getElementById("s5");e5.innerText=pp+"%";e5.className="sv "+(pp>=90?"g":"o");
var sig={},ses={};
for(var i=0;i<c.length;i++){var t=c[i];var rr=getRR(t);var s=G(t,"Signal")||"?";if(!sig[s])sig[s]={n:0,w:0,r:0};sig[s].n++;sig[s].r+=rr;if(rr>0)sig[s].w++;var se=(G(t,"Session")||"?").toUpperCase();if(se==="LONDON")se="LONDRES";if(se==="HORS SESSION")se="HORS KILLZONE";if(!ses[se])ses[se]={n:0,w:0,r:0};ses[se].n++;ses[se].r+=rr;if(rr>0)ses[se].w++}
var h1="";var ks1=Object.keys(sig).sort(function(a,b){return sig[b].r-sig[a].r});
for(var i=0;i<ks1.length;i++){var k=ks1[i];var d=sig[k];var cl=d.r>=0?"g":"r";h1+='<tr><td style="font-weight:bold">'+k+'</td><td class="tt">'+d.n+'</td><td class="tt">'+d.w+'</td><td class="tr '+cl+'">'+(d.r>0?"+":"")+d.r.toFixed(1)+'</td></tr>'}
document.getElementById("t1").innerHTML=h1;
var h2="";var ks2=Object.keys(ses).sort(function(a,b){return ses[b].r-ses[a].r});
for(var i=0;i<ks2.length;i++){var k=ks2[i];var d=ses[k];var cl=d.r>=0?"g":"r";h2+='<tr><td style="font-weight:bold">'+k+'</td><td class="tt">'+d.n+'</td><td class="tt">'+d.w+'</td><td class="tr '+cl+'">'+(d.r>0?"+":"")+d.r.toFixed(1)+'</td></tr>'}
document.getElementById("t2").innerHTML=h2;
var list=trades.slice().reverse().slice(0,10);var hl="";
for(var i=0;i<list.length;i++){var t=list[i];var p=G(t,"Paire")||"?";var d=G(t,"Date")||"?";var sg=G(t,"Signal")||"?";var rr=getRR(t);var st=G(t,"Statut");var rt=(st==="Annul\u00e9"||st==="Annule")?"ANNULE":((rr>0?"+":"")+rr.toFixed(1)+"R");var cl=(st==="Annul\u00e9"||st==="Annule")?"o":(rr>=0?"g":"r");hl+='<div class="ti"><div><span class="tp">'+p+' <small style="color:var(--m);font-weight:normal">('+sg+')</small></span><br><span class="tm">'+d+'</span></div><div class="tv '+cl+'">'+rt+'</div></div>'}
document.getElementById("tl").innerHTML=hl;
var ctx=document.getElementById("ch").getContext("2d");if(ci)ci.destroy();
var cum=0,dp=[0],lb=["Start"];
for(var i=0;i<c.length;i++){cum+=getRR(c[i]);dp.push(cum);lb.push("T"+(i+1))}
ci=new Chart(ctx,{type:"line",data:{labels:lb,datasets:[{label:"Net R",data:dp,borderColor:"#0ecb81",backgroundColor:"rgba(14,203,129,0.1)",borderWidth:2,fill:true,tension:0.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{grid:{color:"#2b3139"},ticks:{color:"#848e9c"}}}}})
}
function openM(){document.getElementById("modal").style.display="flex"}
function closeM(){document.getElementById("modal").style.display="none"}
function addT(){
var nt={};nt["Date"]=document.getElementById("i1").value;nt["Heure"]=document.getElementById("i2").value;nt["Paire"]=document.getElementById("i3").value.toUpperCase();nt["Sens"]=document.getElementById("i4").value;nt["Signal"]=document.getElementById("i5").value;nt["Session"]=document.getElementById("i6").value;nt["Grade"]=document.getElementById("i7").value;nt["Risque %"]=parseFloat(document.getElementById("i8").value);nt["RR pr\u00e9vu"]=parseFloat(document.getElementById("i9").value);nt["RR r\u00e9alis\u00e9"]=parseFloat(document.getElementById("i10").value);nt["Statut"]=document.getElementById("i11").value;nt["Plan OK"]=document.getElementById("i12").value;nt["Notes"]=document.getElementById("i13").value;nt["R\u00e9sultat %"]=nt["Statut"]==="Closed"?parseFloat((nt["Risque %"]*nt["RR r\u00e9alis\u00e9"]).toFixed(2)):0;
trades.push(nt);save();render();closeM();toast("Sauvegard\u00e9 !");document.getElementById("i3").value="";document.getElementById("i13").value="";document.getElementById("i10").value="0.0"}
function imp(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){try{trades=JSON.parse(e.target.result);save();render();toast("Import\u00e9 ! "+trades.length+" trades")}catch(err){toast("Erreur JSON")}};reader.readAsText(file)}
function exp(){var a=document.createElement("a");a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(trades,null,2));a.download="ghost_journal.json";a.click();toast("JSON Export\u00e9 !")}
function toast(m){var t=document.getElementById("toast");t.innerText=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3000)}
window.onload=init;
</script>
</body>
                                                                                                                                                                                                                                                                                                                                                               </html>
